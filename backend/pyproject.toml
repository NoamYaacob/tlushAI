[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tlushai-backend"
version = "0.1.0"
description = "Israel payroll slip explainer — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.7",
    "pydantic>=2.5,<3",
    "pdfplumber>=0.11,<1",
    "Pillow>=10,<11",
    "pytesseract>=0.3.10,<1",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]
